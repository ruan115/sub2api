name: Recovery foundation

on:
  pull_request:
    paths:
      - 'recovery/**'
      - 'execution-plane/isthmus-runtime/**'
      - 'openspec/changes/restore-online-stack-foundation/**'
      - 'openspec/changes/restore-online-stack-evidence/**'
      - '.github/workflows/recovery-foundation-ci.yml'
  push:
    paths:
      - 'recovery/**'
      - 'execution-plane/isthmus-runtime/**'
      - 'openspec/changes/restore-online-stack-foundation/**'
      - 'openspec/changes/restore-online-stack-evidence/**'
      - '.github/workflows/recovery-foundation-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.9'
      - name: Run synthetic tests and validate discovery catalogs
        run: make -C recovery check
      - name: Check whitespace
        run: git diff --check
