server {
    listen 127.0.0.1:80;
    server_name ccmax.annaapi.com;

    location / {
        include /etc/nginx/snippets/cloudflare-allow.conf;
        return 301 https://ccmax.annaapi.com$request_uri;
    }
}

server {
    listen 127.0.0.1:443 ssl http2;
    server_name ccmax.annaapi.com;

    ssl_certificate /etc/letsencrypt/live/annaapi.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/annaapi.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    client_max_body_size 100m;

    location ~ /\.(?!well-known(?:/|$)) {
        return 404;
    }

    location / {
        include /etc/nginx/snippets/cloudflare-allow.conf;
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cookie_path / "/; Secure";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
